<script>
'use strict';
const IS_NODE=typeof document==='undefined';
let CARDS=[];
const CIVS=['F','W','N','L','D'];
const CIVN={F:'Fire',W:'Water',N:'Nature',L:'Light',D:'Darkness'};
const CIVC={F:'#e2503a',W:'#3b8fe6',N:'#4aa84a',L:'#e8c84a',D:'#7b55a6'};
const sleep=ms=>IS_NODE?Promise.resolve():new Promise(r=>setTimeout(r,ms));
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const C=x=>CARDS[typeof x==='number'?x:x.id];
const isSv=x=>C(x).race.some(r=>/survivor/i.test(r));
function svShare(x,k){if(typeof G==='undefined'||!G||!G.p||!isSv(x))return false;const ow=G.p.find(q=>q.bf.includes(x));if(!ow)return false;return ow.bf.some(g=>g!==x&&isSv(g)&&C(g).kw.includes(k))}
const stBlk=card=>G.p.some(q=>q.bf.some(g=>(C(g).nt||[]).some(v=>C(card).civ.includes(v))||(g.tapped&&C(g).tapNoTrig&&G.p[1-q.i].hand.includes(card))));
function condKw(x,k){const pw=C(x).pw;if(!pw)return false;const ow=ownerOf(x);if(!ow)return false;return pw.some(r=>r.kw&&r.kw.includes(k)&&condOk(ow,r.cond,x))}
const hasKw=(x,k)=>C(x).kw.includes(k)||(k!=='wave'&&(!!(x.tmp&&x.tmp.includes(k))||!!(x.keepKw&&x.keepKw.some(e=>e.kw===k))||auras(x).some(a=>a.kw===k)||svShare(x,k)||condKw(x,k)));
const paOf=x=>{let v=0;if(x.tmp&&x.tmp.includes('paDark')){const ow=ownerOf(x);if(ow)v+=1000*ow.mana.filter(m=>C(m).civ.includes('D')).length}for(const k of C(x).kw){const m=/^pa(\d+)$/.exec(k);if(m){v=+m[1];break}}for(const a of auras(x)){const m=/^pa(\d+)$/.exec(a.kw||'');if(m)v+=+m[1]}for(const k of x.tmp||[]){const m=/^pa(\d+)$/.exec(k);if(m)v+=+m[1]}{const pw=C(x).pw,ow=pw&&ownerOf(x);if(ow)for(const r of pw)if(r.pa&&condOk(ow,r.cond,x))v+=r.pa}return v};
/* static auras granted by creatures in the battle zone (card field `au`) */
function auras(cr){if(typeof G==='undefined'||!G||!G.p||!cr)return [];const out=[];let ow=null;
 for(const q of G.p)if(q.bf.includes(cr)){ow=q;break}
 if(!ow)return out;
 for(const q of G.p)for(const g of q.bf){const au=C(g).au;if(!au)continue;
  for(const a of au){if(q!==ow&&!a.both)continue;if(a.other&&g===cr)continue;if(a.tapped&&!g.tapped)continue;if(a.hasKw&&!a.hasKw.some(k=>C(cr).kw.includes(k)))continue;if(a.cond&&!condOk(q,a.cond,g))continue;
   if(a.race&&!C(cr).race.some(r=>a.race.some(x=>r.toLowerCase().includes(x))))continue;
   if(a.civ&&!C(cr).civ.some(v=>a.civ.includes(v)))continue;if(a.raceWord&&!crRaces(cr).some(r=>new RegExp('\\b'+a.raceWord+'\\b','i').test(r)))continue;out.push(a)}}
 return out}
const ESC=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---------- image sprites ---------- */
function thumbStyle(id){const s=Math.floor(id/100),k=id%100,col=k%10,row=Math.floor(k/10);const n=Math.min(100,CARDS.length-s*100),rows=Math.ceil(n/10);
 return `background-image:url(atl/t${s}.webp);background-size:1000% ${rows*100}%;background-position:${col/9*100}% ${rows>1?row/(rows-1)*100:0}%`}
function mStyle(id){const s=Math.floor(id/4),k=id%4,col=k%2,row=Math.floor(k/2),n=Math.min(4,CARDS.length-s*4),rows=Math.ceil(n/2);
 const ts=Math.floor(id/100),tk=id%100,tc=tk%10,tr=Math.floor(tk/10),tn=Math.min(100,CARDS.length-ts*100),trs=Math.ceil(tn/10);
 return `background-image:url(atl/m${s}.webp),url(atl/t${ts}.webp);background-size:200% ${rows*100}%,1000% ${trs*100}%;background-position:${col*100}% ${rows>1?row/(rows-1)*100:0}%,${tc/9*100}% ${trs>1?tr/(trs-1)*100:0}%`}
function zoomStyle(id){const s=Math.floor(id/4),k=id%4,col=k%2,row=Math.floor(k/2);const n=Math.min(4,CARDS.length-s*4),rows=Math.ceil(n/2);
 const ts=Math.floor(id/100),tk=id%100,tc=tk%10,tr=Math.floor(tk/10),tn=Math.min(100,CARDS.length-ts*100),trs=Math.ceil(tn/10);
 return `background-image:url(atl/y${s}.webp),url(atl/m${s}.webp),url(atl/t${ts}.webp);background-size:200% ${rows*100}%,200% ${rows*100}%,1000% ${trs*100}%;background-position:${col*100}% ${rows>1?row/(rows-1)*100:0}%,${col*100}% ${rows>1?row/(rows-1)*100:0}%,${tc/9*100}% ${trs>1?tr/(trs-1)*100:0}%`}
const zq=[],zdone=new Set();let zrun=0;
function queueZoom(ids,front){if(IS_NODE)return;const ss=[...new Set(ids.map(i=>Math.floor(i/4)))].filter(x=>!zdone.has(x));
 for(const x of ss){zdone.add(x);front?zq.unshift(x):zq.push(x)}zpump()}
function zpump(){while(zrun<2&&zq.length){const x=zq.shift();zrun++;const im=new Image();im.onload=im.onerror=()=>{zrun--;zpump()};im.src=`atl/y${x}.webp`}}
const KWN={double:'Double breaker',triple:'Triple breaker',speed:'Speed Attacker',blocker:'Blocker',slayer:'Slayer',trigger:'Shield Trigger',crew:'Crew breaker',charger:'Charger',toManaT:'Goes to mana tapped',mustBlock:'Blocks if able'};
function fxTxt(f){if(f.txt)return f.txt;switch(f.op){case 'destroy':return `Destroy one rival creature${f.maxPower?` with ${f.maxPower} power or less`:''}.`;case 'destroyAll':return `Destroy all creatures with ${f.maxPower} power or less.`;
 case 'bounce':return "Return a creature to its owner's hand.";case 'tap':return `Tap ${f.n>1?'up to '+f.n:'one'} rival creature${f.n>1?'s':''}.`;
 case 'draw':return `Draw ${f.optional?'up to ':''}${f.n} card${f.n>1?'s':''}.`;case 'shieldTop':return `Add ${f.n} card${f.n>1?'s':''} to your shields.`;
 case 'manaTop':return 'Put the top card of your deck into mana.';case 'buff':return `+${f.amount} power until end of turn.`;case 'searchRace':return `Search your deck for an ${f.race}.`}return ''}
const GLOW={F:'#ff3b30',W:'#5ac8fa',N:'#34c759',L:'#ffd53d',D:'#9b6dff'};
const mixc=(h,k)=>{const n=parseInt(h.slice(1),16),b=[21,24,38],r=[n>>16&255,n>>8&255,n&255];return '#'+r.map((v,i)=>Math.round(b[i]+(v-b[i])*k).toString(16).padStart(2,'0')).join('')};
const civBand=civ=>{const cs=civ.map(c=>GLOW[c]);const dark=cs.map(c=>mixc(c,.32)),mid=cs.map(c=>mixc(c,.55));
 const bg=cs.length>1?`linear-gradient(90deg,${dark.map((d,i)=>`${d} ${i*100/(cs.length)}%,${mid[i]} ${(i+.5)*100/cs.length}%`).join(',')},${dark[dark.length-1]} 100%)`:`linear-gradient(90deg,${dark[0]},${mid[0]} 60%,${dark[0]})`;
 const lc=cs.length>1?'#fff':cs[0];const ico=civ.map((c,i)=>`<div style="position:absolute;left:${cs.length>1?1730+i*160:('LF'.includes(c)?1740:1715)}px;top:${cs.length>1?170:('LF'.includes(c)?105:80)}px;width:${cs.length>1?140:('LF'.includes(c)?280:330)}px;height:${cs.length>1?140:('LF'.includes(c)?280:330)}px;filter:drop-shadow(0 0 22px ${GLOW[c]})"><div style="width:100%;height:100%;background:${GLOW[c]};-webkit-mask:url(atl/civ_${c}.png) center/contain no-repeat;mask:url(atl/civ_${c}.png) center/contain no-repeat"></div></div>`).join('');
 return {bg,lc,ico,kc:cs.length>1?'#fff':cs[0]}};
const gv=id=>`--g:${GLOW[CARDS[id].civ[0]]}`;const gc=id=>CARDS[id].civ.length>1?' rb':'';
const kwTxt=c=>c.kw.map(k=>KWN[k]||(/^pa\d+$/.test(k)?'Power Attacker +'+k.slice(2):'')).filter(Boolean).join(' · ')+(c.rs&&c.rs.length?(c.kw.length?' · ':'')+c.rs.map(r=>({unblock:"Can't be blocked",unatk:"Can't be attacked",noatk:"Can't attack",atkU:'Attacks untapped creatures'}[r.k]||'')+(r.by?' (some)':'')+(r.cond?' (conditional)':'')).join(' · '):'');
/* ---------- game state ---------- */
let G=null,AUTO=false,uidc=1;
const inst=id=>({id,uid:uidc++});
function newPlayer(deck,human,i){const d=shuffle(deck.map(inst));const p={i,human,deck:d,hand:[],shields:[],mana:[],bf:[],gy:[],charged:false};
 for(let k=0;k<5;k++)p.shields.push(p.deck.pop());for(let k=0;k<5;k++)p.hand.push(p.deck.pop());return p}
function log(s){G.log.push(s);if(G.log.length>200)G.log.shift()}
const nm=x=>C(x).n;
function ownerOf(cr){return G.p.find(p=>p.bf.includes(cr))}
function cardsOf(cr){return [{id:cr.id,uid:cr.uid},...cr.under]}
function leaveCards(cr,ow){let cs=cardsOf(cr);
 for(const f of C(cr).fx||[])if(f.when==='leave'&&ow)(G.q=G.q||[]).push({p:ow,f,cr});
 if(C(cr).topOnly&&cr.under.length&&ow){cs=[cs[0]];for(const u of cr.under)ow.bf.push({id:u.id,uid:u.uid,tapped:cr.tapped,sick:false,noSick:true,buf:0,under:[]});log(`Only the top card of ${nm(cr)} leaves the battle zone; the other cards stay as separate creatures.`)}
 return cs}
function vBases(p,c){const m=r=>p.bf.filter(b=>crRaces(b).some(x=>x.toLowerCase()===r||x.toLowerCase()===r+'s'));const A=m(c.vortex[0]),B=m(c.vortex[1]);
 if(!A.length||!B.length||(A.length===1&&B.length===1&&A[0]===B[0]))return null;return [A,B]}
function crRaces(cr){return cr&&cr.xrace?C(cr).race.concat(cr.xrace):C(cr).race}
function power(cr,att,vs){let v=(C(cr).p||0)+cr.buf;const ow=ownerOf(cr);
 for(const a of auras(cr))if(a.n)v+=a.n;
 const pw=C(cr).pw;if(pw&&ow)for(const r of pw){if(!r.n)continue;if(r.att&&!att)continue;if(r.vs&&!(vs&&byOk(r.vs,vs)))continue;if(!condOk(ow,r.cond,cr))continue;v+=r.n*(r.each?countEach(ow,r.each,cr):1)}
 if(ow)for(const o of ow.bf){if(o===cr)continue;const st=C(o).st;if(st)for(const s of st)if(crRaces(cr).includes(s.buffRace))v+=s.n}
 if(ow&&isSv(cr)){const seen=new Set([cr.id]);for(const g of ow.bf){if(g===cr||!isSv(g)||seen.has(g.id))continue;seen.add(g.id);for(const r of C(g).pw||[]){if(!r.n||(r.att&&!att)||(r.vs&&!(vs&&byOk(r.vs,vs)))||!condOk(ow,r.cond,cr))continue;v+=r.n*(r.each?countEach(ow,r.each,cr):1)}}}
 if(att)v+=paOf(cr);return v}
function breakCount(p,cr){if(hasKw(cr,'triple'))return 3;if(hasKw(cr,'double'))return 2;
 if(hasKw(cr,'crew')){const r=C(cr).crewRace;return Math.max(1,p.bf.filter(o=>crRaces(o).includes(r)).length)}return 1}
/* ---------- mana ---------- */
function costOf(p,id){const c=CARDS[id];let n=c.cost;if(typeof G==='undefined'||!G||!G.p||!p)return n;
 let inc=0,red=0,mn=0;
 for(const q of G.p)for(const g of q.bf){const cm=C(g).cm;if(!cm)continue;
  for(const e of cm){if(e.who==='own'&&q!==p)continue;if(e.t&&e.t!==c.t)continue;
   if(e.civ&&!c.civ.some(v=>e.civ.includes(v)))continue;
   if(e.raceWord&&!(c.race||[]).some(r=>new RegExp('\\b'+e.raceWord+'\\b','i').test(r)))continue;
   if(e.n>0)inc+=e.n;else{red+=-e.n;if(e.min>mn)mn=e.min}}}
 let r=n+inc;if(red)r=Math.max(r-red,Math.min(mn,r));return Math.max(r,c.civ.length,0)}
function planPay(p,id){const c=CARDS[id],cost=costOf(p,id),un=p.mana.filter(m=>!m.tapped);if(un.length<cost)return null;const ch=[];
 for(const civ of c.civ){if(ch.some(m=>C(m).civ.includes(civ)))continue;
  const cand=un.filter(m=>!ch.includes(m)&&C(m).civ.includes(civ)).sort((a,b)=>C(a).civ.length-C(b).civ.length);
  if(!cand.length)return null;ch.push(cand[0])}
 const rest=un.filter(m=>!ch.includes(m)).sort((a,b)=>C(a).civ.length-C(b).civ.length);
 while(ch.length<cost)ch.push(rest.shift());return ch}

  const mine=r=>p.bf.filter(x=>crRaces(x).includes(r)).length+(f.from==='gy'?p.gy.filter(x=>crRaces(x).includes(r)).length:0)+(f.from==='hand'?p.hand.filter(x=>crRaces(x).includes(r)).length:0);
  const i=await choose(p,'Choose a race',rs.map(r=>({label:r})),{ai:os=>argmax(os,x=>mine(x.label))});if(i<0)return;
  f={...f,chooseRace:false,filter:{...(f.filter||{}),race:rs[i].toLowerCase()}}}

 const seen=new Set([src.id]),ex=[];for(const g of ow.bf){if(g===src||!isSv(g)||seen.has(g.id))continue;seen.add(g.id);for(const f of C(g).fx||[])if(f.when===when)ex.push(f)}return ex.length?list.concat(ex):list}

 await ui.fx('cut',{kind:'SUMMON',id:cr.id,title:nm(cr),sub:[`${C(cr).cost} mana`,C(cr).p+' power',kwTxt(C(cr))].filter(Boolean).join(' · '),tone:p.i?'rival':'you'});ui.render();setTimeout(()=>ui.fxNow('land',{uid:cr.uid,tone:p.i?'rival':'you'}),500);await runFx(p,C(cr).fx,'etb',cr);
 if(C(cr).evo)for(const q of G.p)for(const g of [...q.bf])if(g!==cr&&q.bf.includes(g)&&!G.over&&(C(g).fx||[]).some(f=>f.when==='evolveAny'))await runFx(q,C(g).fx,'evolveAny',g);

 return cr}

async function battle(a,d){const pa=power(a,true,d),pd=power(d,false,a);log(`${nm(a)} (${pa}) battles ${nm(d)} (${pd}).`);
 let aDies=pd>pa||hasKw(d,'slayer')||pd===pa,dDies=pa>pd||hasKw(a,'slayer')||pd===pa;
 if(aDies&&C(a).surviveVs&&byOk(C(a).surviveVs,d)){aDies=false;log(`${nm(a)} isn't destroyed.`)}
 if(dDies&&C(d).surviveVs&&byOk(C(d).surviveVs,a)){dDies=false;log(`${nm(d)} isn't destroyed.`)}
 if(dDies)await destroyCr(d);if(aDies)await destroyCr(a);await flushQ();
 for(const [x,won] of [[a,dDies&&!aDies],[d,aDies&&!dDies]]){const ow=ownerOf(x);if(ow&&won&&!G.over){if(x.tmp&&x.tmp.includes('untapWin')){x.tapped=false;log(`${nm(x)} untapped.`)}await runFx(ow,C(x).fx,'win',x)}}
